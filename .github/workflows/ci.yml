name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install pip==25.2
          python -m pip install -e . --group dev
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install pip==25.2
          python -m pip install -e . --group dev
      - name: Tests with coverage (fails under 95%)
        run: pytest --cov --cov-report=term-missing
      - name: Benchmark smoke run (tiny inputs)
        run: python bench/run.py --quick
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Install the wheel into a clean venv and import it
        shell: bash
        run: |
          python -m venv /tmp/wheel-check
          if [ -x /tmp/wheel-check/bin/python ]; then py=/tmp/wheel-check/bin/python; else py=/tmp/wheel-check/Scripts/python; fi
          "$py" -m pip install --quiet dist/*.whl
          cd /tmp && "$py" -c "import dsa; print(dsa.__version__, len(dsa.__all__), 'names'); assert dsa.AVLTree({1: 2})[1] == 2"
